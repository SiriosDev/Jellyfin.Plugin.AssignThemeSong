name: Jellyfin 12 build and release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Resolve release version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG"
            echo "Expected a tag in the form vX.Y.Z"
            exit 1
          fi

          DOTNET_VERSION="${VERSION}.0"

          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "DOTNET_VERSION=$DOTNET_VERSION" >> "$GITHUB_ENV"

      - name: Update plugin versions
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          dotnet_version = os.environ["DOTNET_VERSION"]

          csproj = Path("Jellyfin.Plugin.AssignThemeSong.csproj")
          text = csproj.read_text(encoding="utf-8")
          for property_name in ("Version", "AssemblyVersion", "FileVersion"):
              pattern = rf"<{property_name}>[^<]*</{property_name}>"
              replacement = f"<{property_name}>{dotnet_version}</{property_name}>"
              text, count = re.subn(pattern, replacement, text)
              if count != 1:
                  raise RuntimeError(f"Expected one <{property_name}> in {csproj}")
          csproj.write_text(text, encoding="utf-8")

          meta_path = Path("meta.json")
          meta = json.loads(meta_path.read_text(encoding="utf-8-sig"))
          meta["version"] = dotnet_version
          meta_path.write_text(json.dumps(meta, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          print(f"Plugin version: {dotnet_version}")
          PY

          cp Jellyfin.Plugin.AssignThemeSong.csproj "$RUNNER_TEMP/Jellyfin.Plugin.AssignThemeSong.csproj"
          cp meta.json "$RUNNER_TEMP/meta.json"

      - name: Build
        run: dotnet build Jellyfin.Plugin.AssignThemeSong.csproj --configuration Release

      - name: Package
        shell: bash
        run: |
          rm -rf package
          mkdir package
          cp -a bin/Release/net10.0/. package/
          cd package
          zip -r "../xThemeSong_${TAG}.zip" .

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSET="xThemeSong_${TAG}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" --title "xThemeSong ${VERSION} - Jellyfin 12" --generate-notes
          fi

      - name: Update manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json
          import os
          from pathlib import Path

          tag = os.environ["TAG"]
          version = os.environ["VERSION"]
          dotnet_version = os.environ["DOTNET_VERSION"]
          asset = Path(f"xThemeSong_{tag}.zip")
          checksum = hashlib.md5(asset.read_bytes()).hexdigest().upper()
          path = Path("manifest.json")
          data = json.loads(path.read_text(encoding="utf-8-sig"))

          entry = {
              "version": dotnet_version,
              "checksum": checksum,
              "changelog": f"{tag}: Jellyfin 12 release.",
              "targetAbi": "12.0.0.0",
              "sourceUrl": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/xThemeSong_{tag}.zip"
          }

          for plugin in data:
              plugin["owner"] = os.environ["GITHUB_REPOSITORY_OWNER"]
              versions = plugin.setdefault("versions", [])
              versions[:] = [v for v in versions if v.get("version") != dotnet_version]
              versions.insert(0, entry)

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Manifest checksum: {checksum}")
          PY

      - name: Persist version files
        shell: bash
        run: |
          cp "$RUNNER_TEMP/Jellyfin.Plugin.AssignThemeSong.csproj" Jellyfin.Plugin.AssignThemeSong.csproj
          cp "$RUNNER_TEMP/meta.json" meta.json
          cp manifest.json "$RUNNER_TEMP/manifest.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git switch --detach origin/main

          cp "$RUNNER_TEMP/Jellyfin.Plugin.AssignThemeSong.csproj" Jellyfin.Plugin.AssignThemeSong.csproj
          cp "$RUNNER_TEMP/meta.json" meta.json
          cp "$RUNNER_TEMP/manifest.json" manifest.json

          git add Jellyfin.Plugin.AssignThemeSong.csproj meta.json manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish $TAG version $VERSION"
            git push origin HEAD:main
          fi
